# Stack `snippet-searcher`: the shared, stateful part of the system (reverse proxy, databases, cache,
# blob storage, synthetic check). It changes rarely and is deployed on its own; the application
# services live in their own stacks (service.yml, permission.yml, engine.yml, ui.yml) so that
# publishing a new image for one microservice never touches anything else.
#
# The stack keeps the historical name `snippet-searcher` on purpose: the data volumes are named
# `<stack>_<volume>`, so renaming the stack would create empty databases. nginx stays
# `snippet-searcher_nginx`, which is what scripts/certbot-deploy-hook.sh and deploy.sh look up.
#
# Services of the other stacks are reached by their short names (snippet-service, printscript-ui, ...)
# over the external `snippet-network` (see scripts/create-networks.sh). nginx resolves them at request
# time (resolver + variable in proxy_pass), so it starts even when an application stack is down.

x-rolling-update: &rolling-update
  update_config:
    parallelism: 1
    delay: 20s
    order: start-first
    failure_action: rollback
    monitor: 90s
  rollback_config:
    parallelism: 1
    order: start-first

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  nginx:
    image: nginx:1.28-alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    configs:
      - source: nginx-config
        target: /etc/nginx/conf.d/default.conf
    secrets:
      - source: tls-cert
        target: tls_cert
      - source: tls-key
        target: tls_key
        mode: 0400
    volumes:
      - type: bind
        source: /var/www/certbot
        target: /var/www/certbot
        read_only: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - snippet-network
    deploy:
      <<: *rolling-update
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - snippet-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  snippet-service-db:
    image: postgres:17
    environment:
      POSTGRES_DB: "${SERVICE_POSTGRES_DB:?SERVICE_POSTGRES_DB must be set}"
      POSTGRES_USER: "${SERVICE_POSTGRES_USER:?SERVICE_POSTGRES_USER must be set}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - source: service-postgres-password
        target: postgres_password
    healthcheck: *postgres-healthcheck
    volumes:
      - snippet-service-db-data:/var/lib/postgresql/data
    networks:
      - snippet-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  snippet-permission-db:
    image: postgres:17
    environment:
      POSTGRES_DB: "${PERMISSION_POSTGRES_DB:?PERMISSION_POSTGRES_DB must be set}"
      POSTGRES_USER: "${PERMISSION_POSTGRES_USER:?PERMISSION_POSTGRES_USER must be set}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - source: permission-postgres-password
        target: postgres_password
    healthcheck: *postgres-healthcheck
    volumes:
      - snippet-permission-db-data:/var/lib/postgresql/data
    networks:
      - snippet-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --location
      - /workspace
    volumes:
      - azurite-data:/workspace
    networks:
      - snippet-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  # Create, read and delete a snippet through the API every minute; results go to New Relic
  # (metrics snippet_searcher.synthetic.*) and to this service's logs. See swarm/synthetic/check.sh.
  synthetic-check:
    image: alpine:3.20
    command: ["sh", "-c", "apk add --no-cache curl jq >/dev/null && exec sh /synthetic/check.sh"]
    configs:
      - source: synthetic-check-script
        target: /synthetic/check.sh
    environment:
      BASE_URL: "http://snippet-service:8080"
      CHECK_INTERVAL: "60"
      CHECK_ENVIRONMENT: "${DEPLOY_ENVIRONMENT:-unknown}"
      AUTH0_DOMAIN: "${AUTH0_DOMAIN:?AUTH0_DOMAIN must be set}"
      AUTH0_AUDIENCE: "${AUTH0_AUDIENCE:?AUTH0_AUDIENCE must be set}"
      SYNTHETIC_CLIENT_ID: "${SYNTHETIC_CLIENT_ID:?SYNTHETIC_CLIENT_ID must be set}"
    secrets:
      - source: synthetic-client-secret
        target: SYNTHETIC_CLIENT_SECRET
      - source: new-relic-license-key
        target: NEW_RELIC_LICENSE_KEY
    networks:
      - snippet-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 30s

configs:
  nginx-config:
    name: "nginx-config-${NGINX_CONFIG_VERSION:?NGINX_CONFIG_VERSION must be set}"
    # rendered by scripts/deploy.sh from nginx/default.conf with this environment's DOMAIN
    file: ../nginx/default.rendered.conf
  synthetic-check-script:
    name: "synthetic-check-script-${SYNTHETIC_SCRIPT_VERSION:?SYNTHETIC_SCRIPT_VERSION must be set}"
    file: ../synthetic/check.sh

secrets:
  service-postgres-password:
    external: true
  permission-postgres-password:
    external: true
  new-relic-license-key:
    external: true
  synthetic-client-secret:
    external: true
  tls-cert:
    external: true
    name: "tls-cert-${TLS_VERSION:?TLS_VERSION must be set}"
  tls-key:
    external: true
    name: "tls-key-${TLS_VERSION:?TLS_VERSION must be set}"

# Created once by scripts/create-networks.sh and shared by every stack.
networks:
  snippet-network:
    external: true
    name: snippet-network

volumes:
  snippet-service-db-data:
  azurite-data:
  snippet-permission-db-data:
  redis-data:

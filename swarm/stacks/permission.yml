# Stack `snippet-permission`: the permission service. Needs the shared stack (infra.yml) for its
# database (snippet-permission-db), reached through the external `snippet-network`.

x-rolling-update: &rolling-update
  update_config:
    parallelism: 1
    delay: 20s
    order: start-first
    failure_action: rollback
    monitor: 90s
  rollback_config:
    parallelism: 1
    order: start-first

x-spring-healthcheck: &spring-healthcheck
  test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 180s

x-java-entrypoint: &java-entrypoint
  - sh
  - -c
  - >-
    export NEW_RELIC_LICENSE_KEY="$$(cat /run/secrets/NEW_RELIC_LICENSE_KEY)";
    exec java -javaagent:/app/newrelic/newrelic.jar -jar app.jar

services:
  snippet-permission-service:
    image: "${PERMISSION_SERVICE_IMAGE:?PERMISSION_SERVICE_IMAGE must be set}"
    entrypoint: *java-entrypoint
    environment:
      DB_HOST: snippet-permission-db
      POSTGRES_DB: "${PERMISSION_POSTGRES_DB:?PERMISSION_POSTGRES_DB must be set}"
      POSTGRES_USER: "${PERMISSION_POSTGRES_USER:?PERMISSION_POSTGRES_USER must be set}"
      SPRING_CONFIG_IMPORT: "configtree:/run/secrets/"
      AUTH0_DOMAIN: "${AUTH0_DOMAIN:?AUTH0_DOMAIN must be set}"
      AUTH0_AUDIENCE: "${AUTH0_AUDIENCE:?AUTH0_AUDIENCE must be set}"
      NEW_RELIC_APP_NAME: "snippet-permission-service-${DEPLOY_ENVIRONMENT:-dev}"
      NEW_RELIC_LOG_FILE_NAME: "STDOUT"
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    healthcheck: *spring-healthcheck
    secrets:
      - source: permission-postgres-password
        target: POSTGRES_PASSWORD
      - source: new-relic-license-key
        target: NEW_RELIC_LICENSE_KEY
    networks:
      - snippet-network
    deploy:
      <<: *rolling-update
      replicas: 1
      restart_policy:
        condition: any

secrets:
  permission-postgres-password:
    external: true
  new-relic-license-key:
    external: true

networks:
  snippet-network:
    external: true
    name: snippet-network

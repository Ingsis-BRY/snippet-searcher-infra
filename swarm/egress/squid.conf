# nr-egress: the only way out of engine-network, an --internal network. The engine runs untrusted code,
# so it has no direct outbound access; its New Relic agent reaches New Relic through this proxy
# (NEW_RELIC_PROXY_HOST), and anything else is refused.
http_port 3128

acl SSL_ports port 443
acl CONNECT method CONNECT
acl newrelic dstdomain .newrelic.com .nr-data.net

# HTTPS tunnels to New Relic only: no plain HTTP, no other host, no other port
http_access allow CONNECT SSL_ports newrelic
http_access deny all

# a pure tunnel: nothing cached, nothing forwarded about the client
cache deny all
cache_mem 8 MB
forwarded_for delete

# Shared by snippet-service (profile api) and snippet-worker (profile worker).
# New Relic app names carry the environment (snippet-service-dev, snippet-service-prod) so the two
# environments never mix in one APM entity; the alert policies (scripts/newrelic-alerts.sh) use them.
x-snippet-service-environment: &snippet-service-environment
  DB_HOST: snippet-service-db
  POSTGRES_DB: "${SERVICE_POSTGRES_DB:?SERVICE_POSTGRES_DB must be set}"
  POSTGRES_USER: "${SERVICE_POSTGRES_USER:?SERVICE_POSTGRES_USER must be set}"
  AUTH0_DOMAIN: "${AUTH0_DOMAIN:?AUTH0_DOMAIN must be set}"
  AUTH0_AUDIENCE: "${AUTH0_AUDIENCE:?AUTH0_AUDIENCE must be set}"
  AUTH0_M2M_CLIENT_ID: "${AUTH0_M2M_CLIENT_ID:?AUTH0_M2M_CLIENT_ID must be set}"
  SPRING_CONFIG_IMPORT: "configtree:/run/secrets/"
  ENGINE_URL: "http://engine-proxy:80"
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  NEW_RELIC_APP_NAME: "snippet-service-${DEPLOY_ENVIRONMENT:-dev}"
  NEW_RELIC_LOG_FILE_NAME: "STDOUT"
  # one JSON object per log line (Elastic Common Schema), with traceId/spanId from Micrometer Tracing
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs

# Zero-downtime rolling updates for stateless services: start the new task first, keep the old one
# serving until the new one is healthy, watch it for 90 s and roll back on its own if it fails its
# healthcheck or exits. One task at a time with a pause between them, so a small VM never starts every
# JVM at once. deploy.sh then waits for every service to settle.
x-rolling-update: &rolling-update
  update_config:
    parallelism: 1
    delay: 20s
    order: start-first
    failure_action: rollback
    monitor: 90s
  rollback_config:
    parallelism: 1
    order: start-first

# Spring services answer /actuator/health/readiness once the context is up (DB, Redis, ...).
# start_period covers JVM start plus the New Relic agent on a busy VM (the prod VM took far longer
# than dev while several JVMs were starting together); failures inside it don't count.
x-spring-healthcheck: &spring-healthcheck
  test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 180s

x-postgres-healthcheck: &postgres-healthcheck
  test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
  interval: 10s
  timeout: 5s
  retries: 5
  start_period: 30s

# The New Relic agent only reads its license key from the environment, so the entrypoint loads it
# from the secret file and then starts the same command as the image (WORKDIR /app).
x-java-entrypoint: &java-entrypoint
  - sh
  - -c
  - >-
    export NEW_RELIC_LICENSE_KEY="$$(cat /run/secrets/NEW_RELIC_LICENSE_KEY)";
    exec java -javaagent:/app/newrelic/newrelic.jar -jar app.jar

x-snippet-service-secrets: &snippet-service-secrets
  - source: service-postgres-password
    target: POSTGRES_PASSWORD
  - source: azure-storage-connection-string-v2
    target: azure.storage.connection-string
  - source: auth0-m2m-client-secret
    target: AUTH0_M2M_CLIENT_SECRET
  - source: new-relic-license-key
    target: NEW_RELIC_LICENSE_KEY

services:
  nginx:
    image: nginx:1.28-alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    configs:
      - source: nginx-config
        target: /etc/nginx/conf.d/default.conf
    secrets:
      - source: tls-cert
        target: tls_cert
      - source: tls-key
        target: tls_key
        mode: 0400
    volumes:
      - type: bind
        source: /var/www/certbot
        target: /var/www/certbot
        read_only: true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - snippet-network
    deploy:
      <<: *rolling-update
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  snippet-service:
    image: "${SNIPPET_SERVICE_IMAGE:?SNIPPET_SERVICE_IMAGE must be set}"
    entrypoint: *java-entrypoint
    secrets: *snippet-service-secrets
    environment:
      <<: *snippet-service-environment
      SPRING_PROFILES_ACTIVE: api
      NEW_RELIC_APP_NAME: "snippet-service-${DEPLOY_ENVIRONMENT:-dev}"
    healthcheck: *spring-healthcheck
    networks:
      - snippet-network
    deploy:
      <<: *rolling-update
      replicas: 1
      restart_policy:
        condition: any

  # Same image as snippet-service, started with the `worker` profile: no HTTP server,
  # it consumes the Redis stream snippet.analysis (lint, format, tests, re-validation).
  snippet-worker:
    image: "${SNIPPET_SERVICE_IMAGE:?SNIPPET_SERVICE_IMAGE must be set}"
    entrypoint: *java-entrypoint
    secrets: *snippet-service-secrets
    environment:
      <<: *snippet-service-environment
      SPRING_PROFILES_ACTIVE: worker
      NEW_RELIC_APP_NAME: "snippet-worker-${DEPLOY_ENVIRONMENT:-dev}"
    networks:
      - snippet-network
    stop_grace_period: 30s
    deploy:
      replicas: 1
      update_config:
        order: stop-first
        failure_action: rollback
        monitor: 60s
      restart_policy:
        condition: any

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - snippet-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  # The engine runs untrusted code. `docker stack deploy` ignores security_opt
  # (no-new-privileges) and pids limits are not reliably supported on the VM's
  # Engine, so the hardening relies on: a non-root `engine` user in the image,
  # ExitOnOutOfMemoryError, the memory/CPU limits and the restart policy below.
  printscript-engine:
    image: "${PRINTSCRIPT_ENGINE_IMAGE:?PRINTSCRIPT_ENGINE_IMAGE must be set}"
    environment:
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    read_only: true
    cap_drop:
      - ALL
    volumes:
      - type: tmpfs
        target: /tmp
    # Replaces the image's HEALTHCHECK (30 s start period): on the prod VM the engine took ~28 s to start
    # while other JVMs were starting, was marked unhealthy and the update rolled back.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/actuator/health/readiness"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 90s
    stop_grace_period: 30s
    networks:
      - engine-network
    deploy:
      replicas: 2
      # dnsrr: DNS returns one address per task, so the proxy's `resolve` and
      # proxy_next_upstream work per replica. No published ports.
      endpoint_mode: dnsrr
      resources:
        limits:
          cpus: "1"
          memory: 512M
      # zero downtime: a third replica starts, and an old one stops only once the new one is healthy,
      # so the engine never drops below 2 replicas during a deploy
      update_config:
        parallelism: 1
        delay: 20s
        order: start-first
        failure_action: rollback
        monitor: 90s
      rollback_config:
        parallelism: 1
        order: start-first
      restart_policy:
        condition: any

  # Internal only: snippet-service reaches the engines through it (ENGINE_URL).
  # `server ... resolve` in engine-proxy.conf needs nginx 1.27.3 or later.
  engine-proxy:
    image: nginx:1.28-alpine
    configs:
      - source: engine-proxy-config
        target: /etc/nginx/conf.d/default.conf
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - engine-network
      - snippet-network
    deploy:
      <<: *rolling-update
      replicas: 1
      restart_policy:
        condition: any

  printscript-ui:
    image: "${PRINTSCRIPT_UI_IMAGE:?PRINTSCRIPT_UI_IMAGE must be set}"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 15s
      timeout: 3s
      retries: 3
    networks:
      - snippet-network
    deploy:
      <<: *rolling-update
      replicas: 1
      restart_policy:
        condition: any

  snippet-service-db:
    image: postgres:17
    environment:
      POSTGRES_DB: "${SERVICE_POSTGRES_DB:?SERVICE_POSTGRES_DB must be set}"
      POSTGRES_USER: "${SERVICE_POSTGRES_USER:?SERVICE_POSTGRES_USER must be set}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - source: service-postgres-password
        target: postgres_password
    healthcheck: *postgres-healthcheck
    volumes:
      - snippet-service-db-data:/var/lib/postgresql/data
    networks:
      - snippet-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  snippet-permission-service:
    image: "${PERMISSION_SERVICE_IMAGE:?PERMISSION_SERVICE_IMAGE must be set}"
    entrypoint: *java-entrypoint
    environment:
      DB_HOST: snippet-permission-db
      POSTGRES_DB: "${PERMISSION_POSTGRES_DB:?PERMISSION_POSTGRES_DB must be set}"
      POSTGRES_USER: "${PERMISSION_POSTGRES_USER:?PERMISSION_POSTGRES_USER must be set}"
      SPRING_CONFIG_IMPORT: "configtree:/run/secrets/"
      AUTH0_DOMAIN: "${AUTH0_DOMAIN:?AUTH0_DOMAIN must be set}"
      AUTH0_AUDIENCE: "${AUTH0_AUDIENCE:?AUTH0_AUDIENCE must be set}"
      NEW_RELIC_APP_NAME: "snippet-permission-service-${DEPLOY_ENVIRONMENT:-dev}"
      NEW_RELIC_LOG_FILE_NAME: "STDOUT"
      LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
    healthcheck: *spring-healthcheck
    secrets:
      - source: permission-postgres-password
        target: POSTGRES_PASSWORD
      - source: new-relic-license-key
        target: NEW_RELIC_LICENSE_KEY
    networks:
      - snippet-network
    deploy:
      <<: *rolling-update
      replicas: 1
      restart_policy:
        condition: any

  snippet-permission-db:
    image: postgres:17
    environment:
      POSTGRES_DB: "${PERMISSION_POSTGRES_DB:?PERMISSION_POSTGRES_DB must be set}"
      POSTGRES_USER: "${PERMISSION_POSTGRES_USER:?PERMISSION_POSTGRES_USER must be set}"
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - source: permission-postgres-password
        target: postgres_password
    healthcheck: *postgres-healthcheck
    volumes:
      - snippet-permission-db-data:/var/lib/postgresql/data
    networks:
      - snippet-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --location
      - /workspace
    volumes:
      - azurite-data:/workspace
    networks:
      - snippet-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: any

  # Create, read and delete a snippet through the API every minute; results go to New Relic
  # (metrics snippet_searcher.synthetic.*) and to this service's logs. See swarm/synthetic/check.sh.
  synthetic-check:
    image: alpine:3.20
    command: ["sh", "-c", "apk add --no-cache curl jq >/dev/null && exec sh /synthetic/check.sh"]
    configs:
      - source: synthetic-check-script
        target: /synthetic/check.sh
    environment:
      BASE_URL: "http://snippet-service:8080"
      CHECK_INTERVAL: "60"
      CHECK_ENVIRONMENT: "${DEPLOY_ENVIRONMENT:-unknown}"
      AUTH0_DOMAIN: "${AUTH0_DOMAIN:?AUTH0_DOMAIN must be set}"
      AUTH0_AUDIENCE: "${AUTH0_AUDIENCE:?AUTH0_AUDIENCE must be set}"
      SYNTHETIC_CLIENT_ID: "${SYNTHETIC_CLIENT_ID:?SYNTHETIC_CLIENT_ID must be set}"
    secrets:
      - source: synthetic-client-secret
        target: SYNTHETIC_CLIENT_SECRET
      - source: new-relic-license-key
        target: NEW_RELIC_LICENSE_KEY
    networks:
      - snippet-network
    deploy:
      replicas: 1
      restart_policy:
        condition: any
        delay: 30s

configs:
  nginx-config:
    name: "nginx-config-${NGINX_CONFIG_VERSION:?NGINX_CONFIG_VERSION must be set}"
    # rendered by scripts/deploy.sh from nginx/default.conf with this environment's DOMAIN
    file: ./nginx/default.rendered.conf
  engine-proxy-config:
    name: "engine-proxy-config-${ENGINE_PROXY_CONFIG_VERSION:?ENGINE_PROXY_CONFIG_VERSION must be set}"
    file: ./nginx/engine-proxy.conf
  synthetic-check-script:
    name: "synthetic-check-script-${SYNTHETIC_SCRIPT_VERSION:?SYNTHETIC_SCRIPT_VERSION must be set}"
    file: ./synthetic/check.sh

secrets:
  service-postgres-password:
    external: true
  permission-postgres-password:
    external: true
  azure-storage-connection-string-v2:
    external: true
  auth0-m2m-client-secret:
    external: true
  new-relic-license-key:
    external: true
  synthetic-client-secret:
    external: true
  tls-cert:
    external: true
    name: "tls-cert-${TLS_VERSION:?TLS_VERSION must be set}"
  tls-key:
    external: true
    name: "tls-key-${TLS_VERSION:?TLS_VERSION must be set}"

networks:
  snippet-network:
    driver: overlay
  engine-network:
    driver: overlay
    internal: true

volumes:
  snippet-service-db-data:
  azurite-data:
  snippet-permission-db-data:
  redis-data:
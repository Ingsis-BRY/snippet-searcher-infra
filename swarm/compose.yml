services:
  nginx:
    image: nginx:1.28-alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    configs:
      - source: nginx-config
        target: /etc/nginx/conf.d/default.conf
    secrets:
      - source: tls-cert
        target: tls_cert
      - source: tls-key
        target: tls_key
        mode: 0400
    volumes:
      - type: bind
        source: /var/www/certbot
        target: /var/www/certbot
        read_only: true
    networks:
      - snippet-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  snippet-service:
    image: "${SNIPPET_SERVICE_IMAGE:?SNIPPET_SERVICE_IMAGE must be set}"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB must be set}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
      AZURE_STORAGE_CONNECTION_STRING: "${AZURE_STORAGE_CONNECTION_STRING:?AZURE_STORAGE_CONNECTION_STRING must be set}"
    networks:
      - snippet-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: "${POSTGRES_DB:?POSTGRES_DB must be set}"
      POSTGRES_USER: "${POSTGRES_USER:?POSTGRES_USER must be set}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - snippet-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  snippet-permission-service:
    image: "${PERMISSION_SERVICE_IMAGE:?PERMISSION_SERVICE_IMAGE must be set}"
    ports:
      - target: 8080
        published: 8081
        protocol: tcp
        mode: ingress
    environment:
      DB_HOST: snippet-permission-db
      POSTGRES_DB: "${PERMISSION_POSTGRES_DB:?PERMISSION_POSTGRES_DB must be set}"
      POSTGRES_USER: "${PERMISSION_POSTGRES_USER:?PERMISSION_POSTGRES_USER must be set}"
      POSTGRES_PASSWORD: "${PERMISSION_POSTGRES_PASSWORD:?PERMISSION_POSTGRES_PASSWORD must be set}"
    networks:
      - snippet-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  snippet-permission-db:
    image: postgres:17
    environment:
      POSTGRES_DB: "${PERMISSION_POSTGRES_DB:?PERMISSION_POSTGRES_DB must be set}"
      POSTGRES_USER: "${PERMISSION_POSTGRES_USER:?PERMISSION_POSTGRES_USER must be set}"
      POSTGRES_PASSWORD: "${PERMISSION_POSTGRES_PASSWORD:?PERMISSION_POSTGRES_PASSWORD must be set}"
    volumes:
      - snippet-permission-db-data:/var/lib/postgresql/data
    networks:
      - snippet-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --location
      - /workspace
    volumes:
      - azurite-data:/workspace
    networks:
      - snippet-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

configs:
  nginx-config:
    name: "nginx-config-${NGINX_CONFIG_VERSION:?NGINX_CONFIG_VERSION must be set}"
    file: ./nginx/default.conf

secrets:
  tls-cert:
    name: "tls-cert-${TLS_VERSION:?TLS_VERSION must be set}"
    file: "${TLS_CERT_FILE:?TLS_CERT_FILE must be set}"
  tls-key:
    name: "tls-key-${TLS_VERSION:?TLS_VERSION must be set}"
    file: "${TLS_KEY_FILE:?TLS_KEY_FILE must be set}"

networks:
  snippet-network:
    driver: overlay

volumes:
  postgres-data:
  azurite-data:
  snippet-permission-db-data:
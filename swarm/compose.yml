services:
  nginx:
    image: nginx:1.28-alpine
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: ingress
      - target: 443
        published: 443
        protocol: tcp
        mode: ingress
    configs:
      - source: nginx-config
        target: /etc/nginx/conf.d/default.conf
    secrets:
      - source: tls-cert
        target: tls_cert
      - source: tls-key
        target: tls_key
        mode: 0400
    volumes:
      - type: bind
        source: /var/www/certbot
        target: /var/www/certbot
        read_only: true
    networks:
      - snippet-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  snippet-service:
    image: "${SNIPPET_SERVICE_IMAGE:?SNIPPET_SERVICE_IMAGE must be set}"
    environment:
      DB_HOST: snippet-service-db
      POSTGRES_DB: "${SERVICE_POSTGRES_DB:?SERVICE_POSTGRES_DB must be set}"
      POSTGRES_USER: "${SERVICE_POSTGRES_USER:?SERVICE_POSTGRES_USER must be set}"
      POSTGRES_PASSWORD: "${SERVICE_POSTGRES_PASSWORD:?SERVICE_POSTGRES_PASSWORD must be set}"
      AZURE_STORAGE_CONNECTION_STRING: "${AZURE_STORAGE_CONNECTION_STRING:?AZURE_STORAGE_CONNECTION_STRING must be set}"
      AUTH0_DOMAIN: "${AUTH0_DOMAIN:?AUTH0_DOMAIN must be set}"
      AUTH0_AUDIENCE: "${AUTH0_AUDIENCE:?AUTH0_AUDIENCE must be set}"
      AUTH0_M2M_CLIENT_ID: "${AUTH0_M2M_CLIENT_ID:?AUTH0_M2M_CLIENT_ID must be set}"
      AUTH0_M2M_CLIENT_SECRET: "${AUTH0_M2M_CLIENT_SECRET:?AUTH0_M2M_CLIENT_SECRET must be set}"
      ENGINE_URL: "http://engine-proxy:80"
      NEW_RELIC_APP_NAME: "snippet-service"
      NEW_RELIC_LICENSE_KEY: "${NEW_RELIC_LICENSE_KEY:?NEW_RELIC_LICENSE_KEY must be set}"
      NEW_RELIC_LOG_FILE_NAME: "STDOUT"
    networks:
      - snippet-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  # The engine runs untrusted code. `docker stack deploy` ignores security_opt
  # (no-new-privileges) and pids limits are not reliably supported on the VM's
  # Engine, so the hardening relies on: a non-root `engine` user in the image,
  # ExitOnOutOfMemoryError, the memory/CPU limits and the restart policy below.
  printscript-engine:
    image: "${PRINTSCRIPT_ENGINE_IMAGE:?PRINTSCRIPT_ENGINE_IMAGE must be set}"
    read_only: true
    cap_drop:
      - ALL
    volumes:
      - type: tmpfs
        target: /tmp
    stop_grace_period: 30s
    networks:
      - engine-network
    deploy:
      replicas: 2
      # dnsrr: DNS returns one address per task, so the proxy's `resolve` and
      # proxy_next_upstream work per replica. No published ports.
      endpoint_mode: dnsrr
      resources:
        limits:
          cpus: "1"
          memory: 512M
      update_config:
        parallelism: 1
        delay: 10s
      restart_policy:
        condition: on-failure

  # Internal only: snippet-service reaches the engines through it (ENGINE_URL).
  # `server ... resolve` in engine-proxy.conf needs nginx 1.27.3 or later.
  engine-proxy:
    image: nginx:1.28-alpine
    configs:
      - source: engine-proxy-config
        target: /etc/nginx/conf.d/default.conf
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - engine-network
      - snippet-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  printscript-ui:
    image: "${PRINTSCRIPT_UI_IMAGE:?PRINTSCRIPT_UI_IMAGE must be set}"
    networks:
      - snippet-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  snippet-service-db:
    image: postgres:17
    environment:
      POSTGRES_DB: "${SERVICE_POSTGRES_DB:?SERVICE_POSTGRES_DB must be set}"
      POSTGRES_USER: "${SERVICE_POSTGRES_USER:?SERVICE_POSTGRES_USER must be set}"
      POSTGRES_PASSWORD: "${SERVICE_POSTGRES_PASSWORD:?SERVICE_POSTGRES_PASSWORD must be set}"
    volumes:
      - snippet-service-db-data:/var/lib/postgresql/data
    networks:
      - snippet-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  snippet-permission-service:
    image: "${PERMISSION_SERVICE_IMAGE:?PERMISSION_SERVICE_IMAGE must be set}"
    environment:
      DB_HOST: snippet-permission-db
      POSTGRES_DB: "${PERMISSION_POSTGRES_DB:?PERMISSION_POSTGRES_DB must be set}"
      POSTGRES_USER: "${PERMISSION_POSTGRES_USER:?PERMISSION_POSTGRES_USER must be set}"
      POSTGRES_PASSWORD: "${PERMISSION_POSTGRES_PASSWORD:?PERMISSION_POSTGRES_PASSWORD must be set}"
      AUTH0_DOMAIN: "${AUTH0_DOMAIN:?AUTH0_DOMAIN must be set}"
      AUTH0_AUDIENCE: "${AUTH0_AUDIENCE:?AUTH0_AUDIENCE must be set}"
      NEW_RELIC_APP_NAME: "snippet-permission-service"
      NEW_RELIC_LICENSE_KEY: "${NEW_RELIC_LICENSE_KEY:?NEW_RELIC_LICENSE_KEY must be set}"
      NEW_RELIC_LOG_FILE_NAME: "STDOUT"
    networks:
      - snippet-network
    deploy:
      replicas: 1
      restart_policy:
        condition: on-failure

  snippet-permission-db:
    image: postgres:17
    environment:
      POSTGRES_DB: "${PERMISSION_POSTGRES_DB:?PERMISSION_POSTGRES_DB must be set}"
      POSTGRES_USER: "${PERMISSION_POSTGRES_USER:?PERMISSION_POSTGRES_USER must be set}"
      POSTGRES_PASSWORD: "${PERMISSION_POSTGRES_PASSWORD:?PERMISSION_POSTGRES_PASSWORD must be set}"
    volumes:
      - snippet-permission-db-data:/var/lib/postgresql/data
    networks:
      - snippet-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    command:
      - azurite-blob
      - --blobHost
      - 0.0.0.0
      - --location
      - /workspace
    volumes:
      - azurite-data:/workspace
    networks:
      - snippet-network
    deploy:
      replicas: 1
      placement:
        constraints:
          - node.role == manager
      restart_policy:
        condition: on-failure

configs:
  nginx-config:
    name: "nginx-config-${NGINX_CONFIG_VERSION:?NGINX_CONFIG_VERSION must be set}"
    file: ./nginx/default.conf
  engine-proxy-config:
    name: "engine-proxy-config-${ENGINE_PROXY_CONFIG_VERSION:?ENGINE_PROXY_CONFIG_VERSION must be set}"
    file: ./nginx/engine-proxy.conf

secrets:
  tls-cert:
    name: "tls-cert-${TLS_VERSION:?TLS_VERSION must be set}"
    file: "${TLS_CERT_FILE:?TLS_CERT_FILE must be set}"
  tls-key:
    name: "tls-key-${TLS_VERSION:?TLS_VERSION must be set}"
    file: "${TLS_KEY_FILE:?TLS_KEY_FILE must be set}"

networks:
  snippet-network:
    driver: overlay
  engine-network:
    driver: overlay
    internal: true

volumes:
  snippet-service-db-data:
  azurite-data:
  snippet-permission-db-data:
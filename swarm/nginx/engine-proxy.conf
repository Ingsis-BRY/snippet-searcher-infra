# The engine proxy: Snippet names the language in a header, and the proxy picks
# that language's engine and spreads the requests over its instances. Adding a
# language means adding an upstream and a line to the map below.

# Docker's DNS; re-resolved every 10 s, so instances that restart or scale
# with new addresses are picked up without reloading the proxy
resolver 127.0.0.11 valid=10s ipv6=off;

upstream printscript {
    zone printscript 64k;
    # one address per running replica; an instance that refuses connections is
    # skipped for fail_timeout while the others keep answering
    server printscript-engine:8080 resolve max_fails=1 fail_timeout=15s;
}

# every instance a request tried, in order, with what each answered
log_format engine '$remote_addr "$request" $status lang=$http_x_language '
                  'upstream=$upstream_addr upstream_status=$upstream_status '
                  'upstream_time=$upstream_response_time';

map $http_x_language $engine {
    default         "";
    ~*^printscript$ printscript;
}

# the interactive run is a WebSocket: pass the upgrade through
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      "";
}

server {
    listen 80;

    # a request carries at most 64 KB of code, plus tests and config
    client_max_body_size 1m;

    # the proxy's own health, for whoever runs it
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # each instance's health is for the orchestrator, not for callers. no trailing
    # slash, so `/actuator` itself and `/actuator;x=y/...` are covered too, and ^~
    # so no regex location can take them first
    location ^~ /actuator {
        return 404;
    }

    location / {
        access_log /var/log/nginx/access.log engine;
        default_type application/problem+json;
        if ($engine = "") {
            return 400 '{"title":"UnknownLanguage","status":400,"detail":"Set the X-Language header to a language that has an engine."}';
        }

        proxy_pass http://$engine;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # on the internal network a live instance accepts in under a millisecond;
        # anything slower is a dead one, so give up on it quickly
        proxy_connect_timeout 1s;
        # longer than the longest answer: a /test of 50 tests x 5 s, or an
        # interactive run waiting up to 5 min for input
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;

        # every operation is stateless and has no side effects, so a request an
        # instance could not take is safe to send to another one, POST included.
        # `timeout` matters: a stopped container drops packets instead of
        # refusing them, so a dead instance shows up as a connect timeout. it
        # also covers read timeouts, but the engine bounds its own work far
        # below proxy_read_timeout.
        # this does not catch everything: when an instance dies, a request that
        # lands while the DNS refresh drops its address can still get a 504.
        # callers should retry once on 502/503/504, which is safe for the same
        # reason as above
        proxy_next_upstream error timeout http_502 http_503 non_idempotent;
        proxy_next_upstream_tries 2;
    }
}
